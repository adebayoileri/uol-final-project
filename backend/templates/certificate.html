<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, serif;
    background: #f8f4ee;
    width: 297mm;
    height: 210mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .border-outer {
    width: 280mm;
    height: 193mm;
    border: 8px solid #4c3a24;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .border-inner {
    width: 270mm;
    height: 183mm;
    border: 2px solid #4c3a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20mm;
    text-align: center;
    gap: 8mm;
  }
  .label {
    font-size: 11pt;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #7a5c36;
  }
  .cert-title {
    font-size: 28pt;
    color: #2c1a0e;
    letter-spacing: 0.05em;
  }
  .awarded-to { font-size: 10pt; color: #5a4030; letter-spacing: 0.2em; text-transform: uppercase; }
  .recipient { font-size: 20pt; color: #2c1a0e; font-style: italic; }
  .completed-label { font-size: 10pt; color: #5a4030; }
  .course-name { font-size: 15pt; color: #2c1a0e; font-weight: bold; }
  .stats { font-size: 10pt; color: #7a5c36; }
  .date { font-size: 10pt; color: #7a5c36; margin-top: 4mm; letter-spacing: 0.1em; }
  hr { border: none; border-top: 1px solid #c0a070; width: 120mm; }
</style>
</head>
<body>
<div class="border-outer">
  <div class="border-inner">
    <div class="label">Certificate of Completion</div>
    <div class="cert-title">AI Course Agent</div>
    <hr>
    <div class="awarded-to">This certificate is awarded to</div>
    <div class="recipient">The Learner</div>
    <div class="completed-label">for successfully completing</div>
    <div class="course-name">{{ course_title }}</div>
    <div class="stats">Mastery achieved: {{ mastery_pct }}%</div>
    <hr>
    <div class="date">Completed on {{ completion_date }}</div>
  </div>
</div>
</body>
</html>
