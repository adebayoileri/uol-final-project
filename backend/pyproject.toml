[project]
name = "course-agent-backend"
version = "0.1.0"
description = "Course creation agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0,<4.0",
    "numpy>=1.24,<2",
    "fsrs>=6.3,<7",
    "python-multipart>=0.0.12",
    "piper-tts>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
